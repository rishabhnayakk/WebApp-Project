<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist & Saved Formulations | Aerosol Webapp</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/index.html" class="header-logo" aria-label="Aerosol Webapp Home"><span>Aerosol Webapp</span></a>
      <nav class="header-nav hidden-mobile">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/shop.html" class="nav-link">Products</a>
        <a href="/about.html" class="nav-link">About</a>
        <a href="/faq.html" class="nav-link">Safety & SDS</a>
        <a href="/contact.html" class="nav-link">Contact</a>
        <a href="/login.html" id="header-auth-nav-link" class="nav-link">Login</a>
      </nav>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm hidden-mobile" onclick="AerosolWebapp.toggleSearch(true)"><span style="font-size: 13px; font-weight: 500;">Search</span></button>
        <a href="/wishlist.html" class="btn btn-ghost btn-sm hidden-mobile" style="position: relative;">
          <span style="font-size: 13px; font-weight: 500;">Wishlist</span>
          <span class="header-wish-badge badge-count" style="display: none;">0</span>
        </a>
        <button class="btn btn-ghost btn-sm" id="header-user-btn" onclick="AerosolWebapp.handleUserIconClick()" aria-label="User Account"><span style="font-size: 13px; font-weight: 500;">Account</span></button>
        <button class="btn btn-neutral btn-sm" onclick="AerosolWebapp.toggleCart(true)" style="position: relative; padding: 7px 14px; gap: 6px;">
          <span class="header-cart-badge badge-count" style="display: none; top: -4px; right: -4px;">0</span>
          <span style="font-size: 13px; font-weight: 500;">Cart</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="section-border-b">
      <div class="container" style="padding-top: 40px; padding-bottom: 32px;">
        <span class="section-label">Saved</span>
        <h1 id="wishlist-heading" class="text-h2">Wishlist</h1>
      </div>
    </div>

    <div class="container" style="padding-top: 40px; padding-bottom: 96px;">
      <div id="wishlist-grid-container">
        <!-- Injected via script -->
      </div>
    </div>
  </main>

  <footer style="border-top: 1px solid var(--color-border); background-color: var(--color-bg); margin-top: auto;">
    <div class="container" style="padding: 40px 32px; font-size: 13px; color: var(--color-text-muted); display: flex; justify-content: space-between;">
      <span>© 2026 Aerosol Webapp Inc.</span>
      <a href="/shop.html">Browse Catalog</a>
    </div>
  </footer>

  <div id="cart-drawer" style="display: none;"><div class="overlay" onclick="AerosolWebapp.toggleCart(false)"></div><div class="drawer" id="cart-drawer-content"></div></div>
  <div id="search-modal" style="display: none;"><div class="overlay" onclick="AerosolWebapp.toggleSearch(false)"></div><div class="search-drop-modal"><div class="container" style="display: flex; align-items: center; height: 64px; gap: 12px;"><span style="font-size: 18px;">🔍</span><input id="search-input" type="search" placeholder="Search aerosol formulations..." oninput="AerosolWebapp.renderSearchResults(this.value)" style="flex: 1; font-size: 16px; border: none; outline: none; background: none;"><button onclick="AerosolWebapp.toggleSearch(false)" class="btn btn-ghost btn-sm">✕</button></div><div class="section-border-t"></div><div id="search-results-content" class="container" style="padding-top: 16px; padding-bottom: 24px;"></div></div></div>
  <div id="toast-container"></div>

  <script src="/js/main.js"></script>
  <script src="/js/auth-component.js"></script>
  <script>
    function renderWishlistPage() {
      const heading = document.getElementById('wishlist-heading');
      if (heading) heading.textContent = `Wishlist (${AerosolWebapp.wishlist.length})`;

      const container = document.getElementById('wishlist-grid-container');
      if (!container) return;

      if (AerosolWebapp.wishlist.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 80px 20px; border-bottom: 1px solid var(--color-border);">
            <h2 style="font-size: 18px; font-weight: 500; margin-bottom: 8px;">Nothing saved yet</h2>
            <p style="font-size: 14px; color: var(--color-text-muted); margin-bottom: 24px;">Browse our catalog to save aerosol formulations.</p>
            <a href="/shop.html" class="btn btn-inverted btn-md">Browse products</a>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="product-grid">
            ${AerosolWebapp.wishlist.map(p => `
              <div class="product-card" onclick="window.location.href='/product.html?id=${p.id}'">
                <div class="product-card__image-wrap">
                  <div class="product-card__canister" style="padding: 32px 0 24px;">
                    ${AerosolWebapp.renderCanister(p.color || '#1e3a5f', 140, p.sku ? p.sku.split('-')[1] : '')}
                  </div>
                  <div class="product-card__quick-add">
                    <button class="btn btn-inverted btn-sm btn-full" onclick="event.stopPropagation(); AerosolWebapp.addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')});">
                      Add to cart
                    </button>
                  </div>
                </div>
                <div class="product-card__info">
                  <div class="product-card__category">${p.category}</div>
                  <div class="product-card__name">${p.name}</div>
                  <div style="font-size: 12px; color: var(--color-text-placeholder); margin-top: 2px;">${p.volume || ''}</div>
                  <div class="product-card__meta">
                    <span style="font-size: 12px; color: var(--color-text-muted);">In stock</span>
                    <div class="product-card__price">$${Number(p.price).toFixed(2)}</div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          <div style="margin-top: 32px; display: flex; justify-content: center; gap: 12px;">
            <button class="btn btn-inverted btn-lg" onclick="addAllToCart()">Add all to cart</button>
            <a href="/shop.html" class="btn btn-neutral btn-lg">Continue shopping</a>
          </div>
        `;
      }
    }

    function addAllToCart() {
      AerosolWebapp.wishlist.forEach(p => AerosolWebapp.addToCart(p, 1, false));
      AerosolWebapp.showToast('Added all saved items to cart.');
      AerosolWebapp.saveCart();
    }

    document.addEventListener('DOMContentLoaded', renderWishlistPage);
  </script>
</body>
</html>
